  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .font-serif-title { font-family: 'Playfair Display', serif; }

    /* On phones, slide the sticky header away while scrolling down. */
    @media (max-width: 767px) {
      #app-header {
        transition: transform 220ms ease;
        will-change: transform;
      }
      #app-header.menu-hidden {
        transform: translateY(-100%);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-header { transition: none !important; }
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg failed:', err));
      });
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script>
    // Hide the mobile header when scrolling down; reveal it when scrolling up.
    (() => {
      let lastY = window.scrollY;
      let scheduled = false;
      const update = () => {
        const y = Math.max(0, window.scrollY);
        const header = document.getElementById('app-header');
        if (header) {
          if (window.innerWidth >= 768 || y < 80) {
            header.classList.remove('menu-hidden');
          } else if (y > lastY + 5) {
            header.classList.add('menu-hidden');
          } else if (y < lastY - 5) {
            header.classList.remove('menu-hidden');
          }
        }
        lastY = y;
        scheduled = false;
      };
      window.addEventListener('scroll', () => {
        if (!scheduled) {
          scheduled = true;
          requestAnimationFrame(update);
        }
      }, { passive: true });
      window.addEventListener('resize', () => {
        document.getElementById('app-header')?.classList.remove('menu-hidden');
        lastY = window.scrollY;
      });
    })();
  </script>

    function ArtworkImage({ artwork, customImages, onUploadCustom }) {
      const [imgUrl, setImgUrl] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(false);

      useEffect(() => {
        if (customImages[artwork.id]) {
          setImgUrl(customImages[artwork.id]);
          setLoading(false);
          setError(false);
          return;
        }

        let cancelled = false;
        setLoading(true);
        setError(false);

        const fetchWikiImage = async () => {
          try {
            const url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(artwork.wikiQuery)}&gsrlimit=1&prop=pageimages&pithumbsize=600&format=json&origin=*`;
            const res = await fetch(url);
            const data = await res.json();
            if (cancelled) return;
            const pages = data?.query?.pages;
            if (pages) {
              const firstPage = Object.values(pages)[0];
              if (firstPage?.thumbnail?.source) {
                setImgUrl(firstPage.thumbnail.source);
                setLoading(false);
                return;
              }
            }
            const commonsUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=filetype:bitmap+${encodeURIComponent(artwork.wikiQuery)}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*`;
            const res2 = await fetch(commonsUrl);
            const data2 = await res2.json();
            if (cancelled) return;
            const pages2 = data2?.query?.pages;
            if (pages2) {
              const firstPage2 = Object.values(pages2)[0];
              const thumb = firstPage2?.imageinfo?.[0]?.thumburl || firstPage2?.imageinfo?.[0]?.url;
              if (thumb) {
                setImgUrl(thumb);
                setLoading(false);
                return;
              }
            }
            setError(true);
            setLoading(false);
          } catch (e) {
            if (!cancelled) {
              setError(true);
              setLoading(false);
            }
          }
        };

        fetchWikiImage();
        return () => { cancelled = true; };
      }, [artwork, customImages]);

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          onUploadCustom(artwork.id, reader.result);
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="relative w-full h-52 bg-slate-100 overflow-hidden flex items-center justify-center group border-b border-slate-200">
          {loading && (
            <div className="flex flex-col items-center gap-2 text-slate-400 text-xs">
              <div className="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
              <span>Pobieranie z Wikimedia...</span>
            </div>
          )}
          {!loading && imgUrl && !error && (
            <img
              src={imgUrl}
              alt={artwork.title}
              className="w-full h-full object-contain bg-slate-900/5 transition-transform duration-300 group-hover:scale-105"
              onError={() => setError(true)}
            />
          )}
          {!loading && error && (
            <div className="p-4 text-center text-xs text-slate-500 flex flex-col items-center gap-2">
              <span className="font-medium text-slate-700">{artwork.title}</span>
              <span>Brak automatycznego podglądu (możesz dodać własne zdjęcie)</span>
            </div>
          )}
          <label className="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-900/80 hover:bg-slate-900 text-white text-[11px] px-2.5 py-1 rounded-md cursor-pointer shadow">
            📷 Zmień zdjęcie
            <input type="file" accept="image/*" className="hidden" onChange={handleFileChange} />
          </label>
        </div>
      );
    }

    
      
      
      
      const speakArtwork = (art) => {
        if (!('speechSynthesis' in window)) {
          alert('Twoja przeglądarka nie obsługuje syntezy mowy.');
          return;
        }
        window.speechSynthesis.cancel();
        
        const cleanTitle = art.title.replace(/[„“”«»]/g, '');
        const cleanAuthor = art.author.replace(/\(.*?\)/g, '').trim();
        
        // Helper to convert Roman numerals to Polish ordinal words for natural speech
        const romanMap = {
          'I': 'pierwszym', 'II': 'drugim', 'III': 'trzecim', 'IV': 'czwartym', 'V': 'piątym',
          'VI': 'szóstym', 'VII': 'siódmym', 'VIII': 'ósmym', 'IX': 'dziewiątym', 'X': 'dziesiątym',
          'XI': 'jedenastym', 'XII': 'dwunastym', 'XIII': 'trzynastym', 'XIV': 'czternastym', 'XV': 'piętnastym',
          'XVI': 'szesnastym', 'XVII': 'siedemnastym', 'XVIII': 'osiemnastym', 'XIX': 'dziewiętnastym', 'XX': 'dwudziestym',
          'XXI': 'dwudziestym pierwszym', 'XXII': 'dwudziestym drugim', 'XXVI': 'dwudziestym szóstym', 'XXVII': 'dwudziestym siódmym'
        };

        let spokenYear = art.year;
        
        // Replace "2 poł." / "1 poł." first
        spokenYear = spokenYear.replace(/2\s*poł\./gi, 'druga połowa');
        spokenYear = spokenYear.replace(/1\s*poł\./gi, 'pierwsza połowa');

        // Replace Roman numeral followed by "w." or "w. p.n.e."
        spokenYear = spokenYear.replace(/\b([IVXLCDM]+)\s*w\.\s*(p\.n\.e\.|n\.e\.)?/g, (match, roman, era) => {
          const ordinal = romanMap[roman] || roman;
          const eraText = era === 'p.n.e.' ? 'przed naszą erą' : (era === 'n.e.' ? 'naszej ery' : '');
          return `${ordinal} wieku ${eraText}`.trim();
        });

        // Also handle general "w." if present without explicit roman numeral
        spokenYear = spokenYear.replace(/w\./g, 'wieku');
        spokenYear = spokenYear.replace(/p\.n\.e\./g, 'przed naszą erą');
        spokenYear = spokenYear.replace(/n\.e\./g, 'naszej ery');

        const text = `Dzieło nosi tytuł: ${cleanTitle}. Autorem jest: ${cleanAuthor}. Powstało w: ${spokenYear}. Należy do epoki: ${art.epoch}.`;
        
        const utterance = new SpeechSynthesisUtterance(text);
        
        const voices = window.speechSynthesis.getVoices();
        // Prefer natural Google or Microsoft or Polish voices if available
        const plVoice = voices.find(v => v.lang && (v.lang === 'pl-PL' || v.lang.startsWith('pl')) && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Zosia') || v.name.includes('Marek'))) 
                     || voices.find(v => v.lang && v.lang.startsWith('pl')) 
                     || voices[0];
        if (plVoice) {
          utterance.voice = plVoice;
        }
        
        utterance.lang = 'pl-PL';
        utterance.rate = 0.95; // Slightly slower for warm natural flow
        utterance.pitch = 1.0; // Normal natural pitch
        
        window.speechSynthesis.speak(utterance);
      };

                          }
                        } else if (opt === advSelAuthor) {
                          btnStyle = "bg-indigo-50 border-indigo-500 text-indigo-900 font-semibold ring-1 ring-indigo-500";
                        }
                        return (
                          <button
                            key={idx}
                            disabled={advChecked}
                            onClick={() => setAdvSelAuthor(opt)}
                            className={`p-3 rounded-lg border text-left text-xs sm:text-sm transition ${btnStyle}`}
                          >
                            {opt}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Pytanie 3: Czas powstania */}
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                    <h3 className="font-bold text-sm text-slate-900 mb-3">
                      3. Kiedy powstało dzieło?
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {advYearOpts.map((opt, idx) => {
                        let btnStyle = "bg-white border-slate-300 hover:bg-slate-100 text-slate-800";
                        if (advChecked) {
                          if (opt === advTarget.year) {
                            btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 font-bold";
                          } else if (opt === advSelYear) {
                            btnStyle = "bg-rose-100 border-rose-500 text-rose-900 font-semibold";
                          } else {
                            btnStyle = "bg-white border-slate-200 text-slate-400 opacity-70";
                          }
                        } else if (opt === advSelYear) {
                          btnStyle = "bg-indigo-50 border-indigo-500 text-indigo-900 font-semibold ring-1 ring-indigo-500";
                        }
                        return (
                          <button
                            key={idx}
                            disabled={advChecked}
                            onClick={() => setAdvSelYear(opt)}
                            className={`p-3 rounded-lg border text-left text-xs sm:text-sm transition ${btnStyle}`}
                          >
                            {opt}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                                  {/* Pytanie 4: Epoka */}
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                    <h3 className="font-bold text-sm text-slate-900 mb-3">
                      4. Do jakiej epoki należy dzieło?
                    </h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {advEpochOpts.map((opt, idx) => {
                        let btnStyle = "bg-white border-slate-300 hover:bg-slate-100 text-slate-800";
                        if (advChecked) {
                          if (opt === advTarget.epoch) {
                            btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 font-bold";
                          } else if (opt === advSelEpoch) {
                            btnStyle = "bg-rose-100 border-rose-500 text-rose-900 font-semibold";
                          } else {
                            btnStyle = "bg-white border-slate-200 text-slate-400 opacity-70";
                          }
                        } else if (opt === advSelEpoch) {
                          btnStyle = "bg-indigo-50 border-indigo-500 text-indigo-900 font-semibold ring-1 ring-indigo-500";
                        }
                        return (
                          <button
                            key={idx}
                            disabled={advChecked}
                            onClick={() => setAdvSelEpoch(opt)}
                            className={`p-3 rounded-lg border text-left text-xs sm:text-sm transition ${btnStyle}`}
                          >
                            {opt}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                </div>

                {/* Przycisk sprawdzenia */}
                <div className="mt-8 flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-100">
                  {!advChecked ? (
                    <button
                      disabled={!advSelTitle || !advSelAuthor || !advSelYear || !advSelEpoch}
                      onClick={() => setAdvChecked(true)}
                      className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white px-8 py-3 rounded-xl text-sm font-bold shadow transition"
                    >
                      Sprawdź odpowiedzi
                    </button>
                  ) : (
                    <div className="w-full flex flex-col sm:flex-row items-center justify-between gap-4">
                      <div className="text-sm font-semibold">
                        {advSelTitle === advTarget.title && advSelAuthor === advTarget.author && advSelYear === advTarget.year && advSelEpoch === advTarget.epoch ? (
                          <span className="text-emerald-700">🎉 Wszystkie 4 odpowiedzi są poprawne!</span>
                        ) : (
                          <span className="text-amber-700">🔍 Sprawdź podświetlenia (zielone = poprawne, czerwone = Twoje błędne).</span>
                        )}
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => speakArtwork(advTarget)}
                          title="Posłuchaj odpowiedzi"
                          className="flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-slate-950 px-4 py-3 rounded-xl text-sm font-bold shadow transition"
                        >
                          🔊 Posłuchaj odpowiedzi
                        </button>
                        <button
                          onClick={generateAdvancedQuiz}
                          className="bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl text-sm font-bold shadow transition"
                        >
                          Następne dzieło →
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === "truefalse" && (

              <div className="max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl border border-slate-200 shadow-md p-6">
                  <div className="flex justify-between items-center text-xs font-semibold text-slate-500 pb-4 border-b border-slate-100">
                    <span>Część 2 egzaminu: JAK? (Charakterystyka stylów)</span>
                    <span>Wynik: {tfScore.correct} / {tfScore.total}</span>
                  </div>

                  <div className="py-6">
                    <span className="inline-block text-xs font-bold px-3 py-1 rounded-full bg-amber-100 text-amber-800 mb-3">
                      {currentTf.epoch}
                    </span>
                    <p className="text-lg font-medium text-slate-900 leading-relaxed">
                      „{currentTf.statement}”
                    </p>
                  </div>

                  {tfAnswer === null ? (
                    <div className="grid grid-cols-2 gap-4">
                      <button
                        onClick={() => {
                          setTfAnswer(true);
                          setTfScore(p => ({ correct: p.correct + (currentTf.isTrue === true ? 1 : 0), total: p.total + 1 }));
                        }}
                        className="py-4 rounded-xl bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-400 text-emerald-900 font-bold text-base transition"
                      >
                        ✅ PRAWDA
                      </button>
                      <button
                        onClick={() => {
                          setTfAnswer(false);
                          setTfScore(p => ({ correct: p.correct + (currentTf.isTrue === false ? 1 : 0), total: p.total + 1 }));
                        }}
                        className="py-4 rounded-xl bg-rose-50 hover:bg-rose-100 border-2 border-rose-400 text-rose-900 font-bold text-base transition"
                      >
                        ❌ FAŁSZ
                      </button>
                    </div>
                  ) : (
                    <div className={`p-4 rounded-xl border ${
                      tfAnswer === currentTf.isTrue ? "bg-emerald-50 border-emerald-300" : "bg-rose-50 border-rose-300"
                    }`}>
                      <div className="font-bold text-sm mb-1">
                        {tfAnswer === currentTf.isTrue ? "🎉 Dobrze!" : "⚠️ Błędna odpowiedź!"}
                      </div>
                      <p className="text-sm text-slate-800">{currentTf.explanation}</p>
                      <button
                        onClick={() => { setTfAnswer(null); setTfIndex(prev => prev + 1); }}
                        className="mt-4 bg-slate-900 text-white px-5 py-2 rounded-lg text-sm font-semibold"
                      >
                        Następne stwierdzenie →
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === "epochs" && (
              <div className="space-y-3 max-w-4xl mx-auto">
                <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-950 mb-4">
                  <strong>Wskazówka egzaminacyjna:</strong> W przypadku <strong>Średniowiecza</strong> (Bizancjum, sztuka preromańska, styl romański, gotyk) oraz <strong>Awangardy i ikon designu</strong> wymagane jest dokładne podanie konkretnego nurtu/stylu.
                </div>
                {EPOCHS.map(ep => (
                  <div key={ep.name} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 justify-between">
                    <div className="md:w-1/3">
                      <span className="text-xs font-bold text-indigo-600 uppercase">Epoka {ep.order}</span>
                      <h3 className="text-lg font-bold text-slate-900">{ep.name}</h3>
                      <p className="text-xs font-semibold text-slate-500 mt-0.5">{ep.time}</p>
                    </div>
                    <div className="md:w-2/3 text-sm text-slate-700 leading-relaxed border-t md:border-t-0 md:border-l border-slate-100 pt-3 md:pt-0 md:pl-5">
                      {ep.traits}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
